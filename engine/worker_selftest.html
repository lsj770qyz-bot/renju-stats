<!doctype html>
<html><head><meta charset="utf-8"><title>Worker stream selftest</title>
<script>
/* 最小测试：Worker 里同步阻塞期间 postMessage 是否能被主线程实时收到 */
var worker;
var log = [];
function add(text) { var el = document.getElementById('log'); el.textContent += text + '\n'; console.log(text); }

function start() {
  add('--- 主线程启动 worker ---');
  worker = new Worker('rapfi-worker.js');

  var seq = 0;
  worker.onmessage = function(ev) {
    var d = ev.data || {};
    if (d.type === 'status') {
      add('主线程收到 status: ' + d.data);
      if (d.data === 'ready') {
        setTimeout(() => {
          add('--- 发 analyze 请求 (timeout 2500ms) ---');
          seq++;
          worker.postMessage({ type: 'analyze', id: seq, moves: [[7*15+7,1],[8*15+8,2],[8*15+7,1],[9*15+7,2],[6*15+8,1]], topN: 10, timeMs: 2500 });
          add('--- 请求已发出，Worker 即将同步阻塞 2.5s ---');
          add('--- 主线程继续空闲等待 postMessage ---');
        }, 300);
      }
    } else if (d.type === 'progress') {
      var wr0 = d.data && d.data.length ? (d.data[0][1]*100).toFixed(1)+'%' : '?';
      add('  +' + d.ms + 'ms  progress#round=' + d.round + ' wr0=' + wr0);
    } else if (d.type === 'result') {
      add('RESULT +' + d.ms + 'ms round=' + d.round + ' count=' + (d.data?d.data.length:0));
    }
  };

  /* 同时主线程开个定时器，每秒打印自己在干嘛 */
  var tick = 0;
  setInterval(function() { tick++; add('  [主线程 tick ' + tick + ']'); }, 500);
}
window.onload = start;
</script>
</head><body>
<pre id="log" style="font-family:monospace;padding:16px;white-space:pre-wrap"></pre>
</body></html>
