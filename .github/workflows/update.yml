name: Update renju data

on:
  schedule:
    # 每周一 11:17（北京时间，UTC+8 = 03:17 UTC）自动更新
    - cron: '17 3 * * 1'
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild games.js from live sources
        run: python scripts/build_data.py games.js

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.js
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "chore: update renju data ($(date -u +%Y-%m-%d))"
            git push
          fi
