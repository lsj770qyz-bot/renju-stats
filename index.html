<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffd88b">
<title>连珠对局胜率分支图 · RenjuNet 数据库</title>
<style>
  :root {
    --brown: #695020;
    --ink: #5a4a2c;
    --muted: #988a70;
    --line: #e2dac8;
    --panel: #fcfaf6;
    --board: #ffd88b;
    --blue: #2f7cf6;
    --green: #34a853;
    --gray: #9aa0a6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #f4f1ea;
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px env(safe-area-inset-right) 16px env(safe-area-inset-left);
  }
  .wrap {
    display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center;
    gap: 16px; width: 100%; max-width: 1080px; position: relative; padding-top: 38px;
  }
  .stage {
    position: relative;
    width: min(92vw, 74vh, 620px);
  }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    box-shadow: 0 6px 22px rgba(105, 80, 32, .16);
    touch-action: manipulation;
    cursor: pointer;
  }
  .tip {
    position: absolute; z-index: 25; pointer-events: none;
    background: rgba(38, 30, 16, .92); color: #ffeec2;
    font-size: 12px; line-height: 1.6;
    padding: 6px 10px; border-radius: 8px;
    white-space: nowrap; transform: translate(-50%, -100%);
  }
  .tip[hidden] { display: none; }
  .panel {
    width: min(92vw, 330px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 4px 16px rgba(105, 80, 32, .07);
  }
  h1 { margin: 0 0 2px; font-size: 21px; color: var(--brown); letter-spacing: 1px; }
  .sub { margin: 0 0 12px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; padding: 8px 2px; font-size: 13px; font-family: inherit;
    color: var(--brown); background: transparent; cursor: pointer;
    border: 1px solid #d9cfb9; border-radius: 8px;
  }
  .tabs button.active { background: var(--board); border-color: #e6c073; font-weight: 700; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; color: var(--brown); margin: 8px 0; gap: 8px;
  }
  .row .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .row label { flex: 0 0 auto; }
  select {
    font-family: inherit; font-size: 13px; color: var(--ink);
    border: 1px solid #d9cfb9; border-radius: 6px; padding: 3px 6px; background: #fff;
    max-width: 170px;
  }
  input[type="number"] {
    font-family: inherit; font-size: 13px; color: var(--ink);
    border: 1px solid #d9cfb9; border-radius: 6px; padding: 3px 4px;
    width: 62px; background: #fff;
  }
  hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .path {
    font-size: 13px; color: var(--ink); line-height: 1.8;
    word-break: break-all; min-height: 24px;
  }
  .path b { color: var(--brown); }
  .legend { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink); margin-top: 8px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: 0 0 12px; }
  .cand { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; max-height: 220px; overflow-y: auto; }
  .cand li {
    display: flex; gap: 6px; align-items: center;
    padding: 3px 4px; border-bottom: 1px dashed #ece5d6; cursor: pointer;
  }
  .cand li:hover { background: #fff6dd; }
  .cand .rank { width: 18px; flex: 0 0 18px; text-align: center; font-weight: 700; color: #fff; border-radius: 6px; font-size: 11px; line-height: 18px; }
  .cand .rank.b { background: var(--blue); }
  .cand .pieceTag { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 16px; }
  .cand .pieceTag.k { background: radial-gradient(circle at 35% 30%, #666, #1a1a1a 75%); border: 1px solid #000; box-shadow: 0 1px 1px rgba(0,0,0,.3); }
  .cand .pieceTag.w { background: radial-gradient(circle at 35% 30%, #fff, #c5c5c5 75%); border: 1px solid #888; box-shadow: 0 1px 1px rgba(0,0,0,.15); }
  .cand .pieceTag.mix { display: inline-flex; }
  .cand .pieceTag.mix .pieceTag.k, .cand .pieceTag.mix .pieceTag.w { width: 10px; height: 10px; flex: 0 0 10px; }
  .cand .pieceTag.mix .pieceTag.w { margin-left: -4px; }
  .cand .rank.g { background: var(--green); }
  .cand .rank.y { background: var(--gray); }
  .cand .coord { font-weight: 700; color: var(--brown); width: 34px; flex: 0 0 34px; }
  .cand .bar { flex: 1; font-variant-numeric: tabular-nums; color: #7d7159; }
  .empty { font-size: 13px; color: var(--muted); line-height: 1.8; }
  .note { margin-top: 10px; font-size: 11px; color: #a89c86; line-height: 1.6; }
  #loading {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: #f4f1ea; font-size: 14px; color: var(--brown);
  }
  /* 选手榜与资料卡 */
  .players { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; max-height: 420px; overflow-y: auto; }
  .players li {
    display: flex; gap: 8px; align-items: baseline;
    padding: 5px 4px; border-bottom: 1px dashed #ece5d6; cursor: pointer;
  }
  .players li:hover { background: #fff6dd; }
  .players .rk { width: 26px; flex: 0 0 26px; color: #a08c62; font-variant-numeric: tabular-nums; }
  .players .rk.r1 { color: #d4a017; font-weight: 800; }
  .players .rk.r2 { color: #8f8f8f; font-weight: 800; }
  .players .rk.r3 { color: #b0653a; font-weight: 800; }
  .players .age { color: var(--muted); font-size: 11px; font-weight: 400; margin-left: 4px; }
  .listToggle { display: flex; gap: 4px; margin-top: 6px; }
  .listToggle button { flex: 1; padding: 3px 0; font-size: 12px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .listToggle button.on { background: var(--brown); color: #fff; border-color: var(--brown); }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin: 16px 0 10px; }
  .endg { margin-top: 8px; font-size: 12px; }
  .endg .egt { color: var(--muted); margin-bottom: 4px; }
  .endg ul { list-style: none; margin: 0; padding: 0; max-height: 160px; overflow-y: auto; }
  .endg li { padding: 3px 2px; border-bottom: 1px dashed var(--line); line-height: 1.5; }
  .endg .yr { color: var(--muted); font-variant-numeric: tabular-nums; }
  .navArrows { display: flex; gap: 14px; justify-content: center; margin-top: 12px; }
  .navArrows button { min-width: 76px; height: 44px; padding: 0 14px; font-size: 20px; border: 1px solid var(--line); background: #fff; border-radius: 10px; cursor: pointer; color: var(--brown); }
  .navArrows #btnReset { font-size: 15px; }
  .navArrows button:active { background: #f0e6d2; }
  .engineRow { display: flex; justify-content: center; margin-top: 10px; }
  #btnEngine {
    width: 100%; height: 48px; font-family: inherit; font-size: 15px; font-weight: 700;
    border: 1px solid #c9bda9; background: #fff; color: var(--brown); border-radius: 10px;
    cursor: pointer; letter-spacing: .5px;
  }
  #btnEngine.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  #btnEngine:active { transform: scale(.985); }
  .players .nm { flex: 1; color: var(--brown); font-weight: 600; }
  .players .nm.f, .pcard .pname.f { color: #c0392b; }
  .players .nm i { font-style: normal; font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 4px; }
  .players .rt { color: var(--ink); font-variant-numeric: tabular-nums; }
  .pcard { font-size: 13px; line-height: 1.9; }
  .pcard .pname { font-size: 17px; font-weight: 700; color: var(--brown); }
  .pcard .pen { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .pcard .back { float: right; font-size: 12px; color: #2f7cf6; cursor: pointer; }
  .langs {
    position: absolute; top: 10px; left: 14px; display: flex; gap: 4px; z-index: 20;
  }
  .langs button {
    font-family: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer;
    border: 1px solid #c9bda9; background: #f4ecd9; color: #6a5d43; border-radius: 5px;
  }
  .langs button.on { background: var(--ink); color: #f4ecd9; border-color: var(--ink); }
</style>
</head>
<body>
<div id="loading">正在载入 165,849 局对局数据…</div>
<div class="wrap">
  <div class="langs" id="langs">
    <button data-lang="zh" class="on">中文</button><button data-lang="en">EN</button><button data-lang="ja">日本語</button><button data-lang="ko">한국어</button>
  </div>
  <div class="stage">
    <canvas id="board"></canvas>
    <div class="tip" id="tip" hidden></div>
    <div class="navArrows"><button id="btnBack" title="撤销一手">◀</button><button id="btnReset">重置</button><button id="btnFwd" title="前进一手">▶</button></div>
    <div class="engineRow"><button id="btnEngine">Rapfi 胜率</button></div>
  </div>
  <div class="panel">
    <h1>胜率分支图</h1>
    <p class="sub" id="tSub">点任意空点落子深入，点棋子或右键回退一手</p>
    <div class="tabs">
      <button id="tabAll" class="active">全部对局</button>
      <button id="tabTop">Top100</button>
      <button id="tabPlayer">选手个人</button>
    </div>
    <div class="row"><label id="lblRule">规则</label><select id="ruleSel"><option value="0">全部规则</option></select></div>
    <div class="row"><label id="lblTime">时间</label><span>
      <select id="yearFrom"></select> – <select id="yearTo"></select>
    </span></div>
    <div class="row"><span id="lblScope">统计范围</span><span class="val" id="dsInfo"></span></div>

    <!-- 选手榜 -->
    <div id="playerListBox">
      <div class="listToggle">
        <button id="ltCur" class="on">现役</button>
        <button id="ltWomen">女子</button>
        <button id="ltQT">QT资格</button>
        <button id="ltAll">全历史</button>
        <button id="ltWomenAll">女子全历史</button>
      </div>
      <ul class="players" id="playerList"></ul>
    </div>

    <!-- 分支视图 -->
    <div id="treeBox">
      <div class="pcard" id="pcard" hidden></div>
      <div id="oppBox" hidden>
        <div class="row"><span id="lblOpp">对手等级分</span><span>
          <input type="number" id="oppLo" value="2600"> – <input type="number" id="oppHi" placeholder="不限">
        </span></div>
        <div class="pcard" id="oppStats"></div>
      </div>
      <div class="legend" id="legendBox">
        <span><i class="dot" style="background:var(--blue)"></i>下得最多的点</span>
        <span><i class="dot" style="background:var(--green)"></i>第 2～10 多的点</span>
        <span><i class="dot" style="background:var(--gray)"></i>其余候选点 · 圈内数字＝落子方得分率%</span>
      </div>
      <hr>
      <div class="row"><span id="lblBranch">当前分支</span><span class="val" id="curInfo"></span></div>
      <div class="path" id="pathView">尚未落子（点击棋盘候选点开始）</div>
      <hr>
      <div class="row"><span id="lblCand">候选落点</span><span class="val" id="candCount"></span></div>
      <ul class="cand" id="candList"></ul>
      <div class="endg" id="endGames"></div>
    </div>
  </div>
</div>
<footer class="foot" id="tFoot">凌世杰 创建 · 数据来源 renju.net 官网 · 禁止商用 · 引擎 Rapfi（GPL-3.0）</footer>

<script src="games.js"></script>
<script>
/* ============================================================
 *  落子音（沿用原站：棋子磕在木棋盘上的「嗒 + 咚」）
 * ============================================================ */
var audioCtx = null;
var stoneNoiseBuf = null;

function playStoneSound() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    var t0 = audioCtx.currentTime + 0.001;

    if (!stoneNoiseBuf) {
      var n = Math.floor(audioCtx.sampleRate * 0.06);
      stoneNoiseBuf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
      var data = stoneNoiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
      }
    }
    var tick = audioCtx.createBufferSource();
    tick.buffer = stoneNoiseBuf;
    var bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2400 + Math.random() * 500;
    bp.Q.value = 0.9;
    var g1 = audioCtx.createGain();
    g1.gain.setValueAtTime(0.9, t0);
    g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.022);
    tick.connect(bp); bp.connect(g1); g1.connect(audioCtx.destination);
    tick.start(t0); tick.stop(t0 + 0.03);

    var parts = [[1520, 0.03, 0.16], [880, 0.05, 0.20], [420, 0.08, 0.13]];
    for (var k = 0; k < parts.length; k++) {
      var f = parts[k][0] * (0.96 + Math.random() * 0.08);
      var dur = parts[k][1];
      var osc = audioCtx.createOscillator();
      var g2 = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t0);
      osc.frequency.exponentialRampToValueAtTime(f * 0.82, t0 + dur);
      g2.gain.setValueAtTime(parts[k][2], t0);
      g2.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
      osc.connect(g2); g2.connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.01);
    }
  } catch (e) { /* 无声环境静默降级 */ }
}

/* ============================================================
 *  棋盘绘制（沿用原站：逻辑坐标 680×680，边距 60，格距 40）
 * ============================================================ */
var N = 15;
var STARS = [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]];
var canvas = document.getElementById('board');
var ctx = canvas.getContext('2d');
var LOGIC = 680, PAD = 60, CELL = 40, STONE_R = 18.8, CAND_R = 16.5;
var tip = document.getElementById('tip');

function resizeCanvas() {
  var rect = canvas.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  var px = Math.max(1, Math.round(rect.width * dpr));
  canvas.width = px;
  canvas.height = px;
  requestDraw();
}
function cx(col) { return PAD + col * CELL; }
function cy(row) { return PAD + row * CELL; }
function coordName(cell) {
  var r = Math.floor(cell / 15), c = cell % 15;
  return String.fromCharCode(97 + c) + (15 - r);
}

/* ============================================================
 *  数据：解码 base64 → typed arrays
 * ============================================================ */
var RAW = window.RENJU_GAMES;
function b64dec(s) {
  var bin = atob(s);
  var u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
var MOVES = b64dec(RAW.moves);
var LENS = b64dec(RAW.lens);
var RULE = b64dec(RAW.rule);
var YEAR = b64dec(RAW.year);   // +1900
var RES = b64dec(RAW.res);     // 0黑胜 1白胜 2和; +4 = top100参与
var _b = b64dec(RAW.black), _w = b64dec(RAW.white);
var NG = LENS.length;
var BLACK = new Uint16Array(NG), WHITE = new Uint16Array(NG);
for (var pi = 0; pi < NG; pi++) {
  BLACK[pi] = _b[pi * 2] | (_b[pi * 2 + 1] << 8);
  WHITE[pi] = _w[pi * 2] | (_w[pi * 2 + 1] << 8);
}
var OFF = new Uint32Array(NG + 1);
for (var oi = 0; oi < NG; oi++) OFF[oi + 1] = OFF[oi] + LENS[oi];

/* ============================================================
 *  棋盘 8 向对称变换（cell = row*15+col，行列均 0..14）
 * ============================================================ */
var SYM = [];
(function () {
  var fns = [
    function (r, c) { return r * 15 + c; },
    function (r, c) { return c * 15 + (14 - r); },
    function (r, c) { return (14 - r) * 15 + (14 - c); },
    function (r, c) { return (14 - c) * 15 + r; },
    function (r, c) { return r * 15 + (14 - c); },
    function (r, c) { return (14 - r) * 15 + c; },
    function (r, c) { return c * 15 + r; },
    function (r, c) { return (14 - c) * 15 + (14 - r); }
  ];
  for (var t = 0; t < 8; t++) {
    var arr = new Uint8Array(225);
    for (var cell = 0; cell < 225; cell++) {
      arr[cell] = fns[t](Math.floor(cell / 15), cell % 15);
    }
    SYM.push(arr);
  }
})();

/* ============================================================
 *  状态与筛选
 * ============================================================ */
var state = {
  dataset: 'all',      // 'all' | 'top100' | 'player'
  playerPid: 0,        // 选手内部 id（dataset='player' 时生效）
  rule: 0,
  yearFrom: 2023, yearTo: 9999,
  moves: [],
  hoverCell: null
};

function passFilter(idx) {
  if (state.dataset === 'top100' && RES[idx] < 4) return false;
  if (state.dataset === 'player' && state.playerPid &&
      BLACK[idx] !== state.playerPid && WHITE[idx] !== state.playerPid) return false;
  if (state.rule !== 0 && RULE[idx] !== state.rule) return false;
  var y = YEAR[idx] + 1900;
  if (y === 1900) return state.yearFrom === 0;
  return y >= state.yearFrom && y <= state.yearTo;
}

var matchList = [];
var histStack = [];

function buildRootMatchList() {
  matchList = [];
  for (var g = 0; g < NG; g++) {
    if (!passFilter(g) || LENS[g] === 0) continue;   // 无棋谱对局只进战绩统计，不进分支树
    var base = g * 8;
    for (var t = 0; t < 8; t++) matchList.push(base + t);
  }
  histStack = [];
}

var seen = new Uint32Array(NG);
var stamp = 0;

/* 当前局面的对称稳定子：保持黑白棋子集合不变的对称变换 */
function stabilizer() {
  var bset = new Uint8Array(225), wset = new Uint8Array(225);
  for (var i = 0; i < state.moves.length; i++) {
    if (i % 2 === 0) bset[state.moves[i]] = 1; else wset[state.moves[i]] = 1;
  }
  var stab = [];
  for (var t = 0; t < 8; t++) {
    var ok = true;
    for (var cell = 0; cell < 225 && ok; cell++) {
      if (bset[cell] && !bset[SYM[t][cell]]) ok = false;
      else if (wset[cell] && !wset[SYM[t][cell]]) ok = false;
    }
    if (ok) stab.push(SYM[t]);
  }
  return stab;
}

/* 候选下一手；对称互通的候选点合并为一个代表点
 * 所有对局都统计（包括对手下一手的对局），保持全部候选可见
 * 选手个人页下同时统计：
 *   - bw_here / ww_here: 选手在本 cell 作为黑方/白方真实落子的局数
 *   - bw0 / ww0: 走到此局面的所有对局中，选手执黑 / 执白的总局数（不管在不在候选点落子）
 * 后两者用于 Canvas 棋盘上方总统计 */
function candidates() {
  var k = state.moves.length;
  var byBlack = k % 2 === 0;
  var agg = {};
  var reached = 0;
  var pid = (state.dataset === 'player' && state.playerPid) ? state.playerPid : 0;
  var bw0 = 0, ww0 = 0;   /* 走到此局面的 bw/ww 总数 */
  stamp++;
  for (var i = 0; i < matchList.length; i++) {
    var e = matchList[i];
    var g = e >> 3, t = e & 7;
    if (seen[g] === stamp) continue;
    seen[g] = stamp;
    reached++;
    if (pid) {
      /* 统计走到此局面的选手执黑/执白总数 */
      if (BLACK[g] === pid) bw0++;
      else if (WHITE[g] === pid) ww0++;
    }
    if (LENS[g] <= k) continue;
    var cell = SYM[t][MOVES[OFF[g] + k]];
    var res = RES[g] & 3;
    var won = (res === 0 && byBlack) || (res === 1 && !byBlack);
    var drew = res === 2;
    var rec = agg[cell];
    if (!rec) rec = agg[cell] = [0, 0, 0, 0, 0];  // [g, w, d, bw_here, ww_here]
    rec[0]++;
    if (won) rec[1]++;
    if (drew) rec[2]++;
    if (pid) {
      /* 选手个人页：判断本 cell 是选手执黑还是执白下的 */
      var asBlack = (BLACK[g] === pid) && byBlack;
      var asWhite = (WHITE[g] === pid) && !byBlack;
      if (asBlack) rec[3]++;
      else if (asWhite) rec[4]++;
      /* 否则：对手在本 cell 下一手，不计入 bw/ww */
    }
  }
  var stab = stabilizer();
  var merged = {};
  for (var key in agg) {
    var c0 = parseInt(key, 10);
    var rep = c0;
    for (var s = 0; s < stab.length; s++) {
      var c2 = stab[s][c0];
      var colR = rep % 15, rowR = Math.floor(rep / 15);
      var colC = c2 % 15, rowC = Math.floor(c2 / 15);
      if (rowC < rowR || (rowC === rowR && colC > colR)) rep = c2;
    }
    var v = agg[key];
    var dst = merged[rep];
    if (!dst) dst = merged[rep] = [0, 0, 0, 0, 0];
    dst[0] += v[0]; dst[1] += v[1]; dst[2] += v[2]; dst[3] += v[3]; dst[4] += v[4];
  }
  var out = [];
  for (var rk in merged) {
    var rv = merged[rk];
    out.push([parseInt(rk, 10), rv[0], rv[1], rv[2], rv[3], rv[4]]);
  }
  out.sort(function (a, b) { return b[1] - a[1]; });
  out.reached = reached;
  out.bw0 = bw0;
  out.ww0 = ww0;
  return out;
}

function rootStats() {
  var g = 0, b = 0, d = 0;
  for (var i = 0; i < NG; i++) {
    if (!passFilter(i)) continue;
    var res = RES[i] & 3;
    g++;
    if (res === 0) b++;
    else if (res === 2) d++;
  }
  return [g, b, d];
}

/* 选手个人战绩（受规则/时间筛选影响） */
function playerStats(pid) {
  var g = 0, gm = 0, bw = 0, bd = 0, bl = 0, ww = 0, wd = 0, wl = 0;
  for (var i = 0; i < NG; i++) {
    if (BLACK[i] !== pid && WHITE[i] !== pid) continue;
    if (state.rule !== 0 && RULE[i] !== state.rule) continue;
    var y = YEAR[i] + 1900;
    if (y === 1900) { if (state.yearFrom !== 0) continue; }
    else if (y < state.yearFrom || y > state.yearTo) continue;
    var res = RES[i] & 3;
    g++;
    if (LENS[i] > 0) gm++;
    if (BLACK[i] === pid) {
      if (res === 0) bw++; else if (res === 2) bd++; else bl++;
    } else {
      if (res === 1) ww++; else if (res === 2) wd++; else wl++;
    }
  }
  return { g: g, gm: gm, bw: bw, bd: bd, bl: bl, ww: ww, wd: wd, wl: wl };
}

/* 选手 vs 指定等级分区间的对手战绩（受规则/时间筛选影响） */
function playerOppStats(pid, lo, hi) {
  var inn = { g: 0, w: 0, d: 0, bg: 0, bw: 0, bd: 0, wg: 0, ww: 0, wd: 0 };
  var out = { g: 0, w: 0, d: 0, bg: 0, bw: 0, bd: 0, wg: 0, ww: 0, wd: 0 };
  for (var i = 0; i < NG; i++) {
    var asBlack = BLACK[i] === pid;
    if (!asBlack && WHITE[i] !== pid) continue;
    if (state.rule !== 0 && RULE[i] !== state.rule) continue;
    var y = YEAR[i] + 1900;
    if (y === 1900) { if (state.yearFrom !== 0) continue; }
    else if (y < state.yearFrom || y > state.yearTo) continue;
    var opp = asBlack ? WHITE[i] : BLACK[i];
    var rt = RAW.ratingByPid[opp];
    if (!rt) continue;   // 对手无等级分，不计入两侧
    var res = RES[i] & 3;
    var won = (res === 0 && asBlack) || (res === 1 && !asBlack);
    var drew = res === 2;
    var rec = (rt >= lo && (hi === 0 || rt <= hi)) ? inn : out;
    rec.g++;
    if (won) rec.w++;
    if (drew) rec.d++;
    if (asBlack) { rec.bg++; if (won) rec.bw++; if (drew) rec.bd++; }
    else { rec.wg++; if (won) rec.ww++; if (drew) rec.wd++; }
  }
  return { inn: inn, out: out };
}

function scoreRate(w, d, g) { return g > 0 ? (w + d * 0.5) / g : 0; }
function statLine(rec) {
  if (rec.g === 0) return t('statNone');
  return '<b>' + rec.g + '</b>' + t('statGames') + t('winRate') + ' ' + fmtPct(rec.w / rec.g) +
    ' · ' + t('scoreRate') + ' ' + fmtPct(scoreRate(rec.w, rec.d, rec.g)) +
    '<br>&nbsp;&nbsp;' + t('asBlack') + ' ' + rec.bg + t('gamesUnit') + '：' + t('winRate') + ' ' + (rec.bg ? fmtPct(rec.bw / rec.bg) : '-') +
    ' · ' + t('scoreRate') + ' ' + (rec.bg ? fmtPct(scoreRate(rec.bw, rec.bd, rec.bg)) : '-') +
    '<br>&nbsp;&nbsp;' + t('asWhite') + ' ' + rec.wg + t('gamesUnit') + '：' + t('winRate') + ' ' + (rec.wg ? fmtPct(rec.ww / rec.wg) : '-') +
    ' · ' + t('scoreRate') + ' ' + (rec.wg ? fmtPct(scoreRate(rec.ww, rec.wd, rec.wg)) : '-');
}

/* 渲染「对手等级分战绩」区块（下限–上限可调，上限空=不限） */
function renderOppStats() {
  if (!currentPlayer || !state.playerPid) return;
  var lo = parseInt(elOppLo.value, 10);
  var hi = parseInt(elOppHi.value, 10);
  if (isNaN(lo)) lo = 0;
  if (isNaN(hi)) hi = 0;
  var r = playerOppStats(state.playerPid, lo, hi);
  var loTxt = lo + t('ratingUnit') + (hi ? '–' + hi + t('ratingUnit') : t('oppIn3'));
  elOppStats.innerHTML =
    t('oppIn1') + '<b>' + loTxt + '</b>' + t('oppIn2') + '<br>' + statLine(r.inn) +
    '<br>' + t('oppOut') + '<b>' + t('oppOut2') + '</b>' + t('oppOut3') + '<br>' + statLine(r.out) +
    '<br><span style="color:#a89c86;font-size:11px">' + t('oppNote') + '</span>';
}

function descend(cell) {
  var k = state.moves.length;
  histStack.push(matchList);
  var next = [];
  for (var i = 0; i < matchList.length; i++) {
    var e = matchList[i];
    var g = e >> 3, t = e & 7;
    if (LENS[g] <= k) continue;
    if (SYM[t][MOVES[OFF[g] + k]] === cell) next.push(e);
  }
  matchList = next;
  state.moves.push(cell);
}

function undo() {
  if (state.moves.length === 0) return;
  matchList = histStack.pop();
  redoStack.push(state.moves.pop());
  refresh();
}

var redoStack = [];
function redo() {
  if (redoStack.length === 0) return;
  descend(redoStack.pop());
  playStoneSound();
  refresh();
}

function fmtPct(x) { return (x * 100).toFixed(1) + '%'; }
function candColor(rank) {
  if (rank === 0) return '#2f7cf6';
  if (rank <= 9) return '#34a853';
  return '#9aa0a6';
}

var lastCands = [];
var endedGames = [];   /* 在当前局面正好走完全部棋谱的对局编号（去重） */
var branchGames = [];  /* 当前分支剩下的对局编号（去重，按出现顺序） */

/* ============================================================
 *  胜率显示：开源连珠引擎 Rapfi（WASM，懒加载）为正式口径，
 *  引擎返回自己认为的 Top-10 好点（独立于数据库候选点）；
 *  载入前/载入失败时用下面的内置轻量估算兜底。
 * ============================================================ */
var engineOn = false;
var engineTop = null;    /* 引擎自选 Top-10：[[cell, wr], ...]，引擎模式下直接驱动棋盘显示 */
var engineBusy = false;  /* 正在等 Rapfi 结果 */
/* 动画：圆圈 wr/alpha 平滑过渡，避免数值瞬间跳变 */
var engineAnim = [];     /* [{cell, wr, targetWr, alpha, targetAlpha, rank, targetRank}] */
var animRafId = 0;       /* rAF 循环 id */

var EDIR = [[0, 1], [1, 0], [1, 1], [1, -1]];

/* 棋形模式表（以落点为中心取 11 格字符串：1=我方 2=对方/边外 0=空） */
var P_FOUR = ['11011', '10111', '11101', '011112', '211110'];
var P_OPEN3 = ['01110', '011010', '010110', '011100', '001110'];
var P_THREE = ['211100', '001112', '11001', '10011', '10101', '210110', '011012'];
var P_TWO = ['00110', '01100', '01010', '010010', '011000'];

/* 棋形等级：0 无 / 1 活二 / 2 眠三 / 3 活三 / 4 冲四 / 5 活四 / 6 成五 */
function lineClass(s) {
  if (s.indexOf('11111') >= 0) return 6;
  if (s.indexOf('011110') >= 0) return 5;
  var i;
  for (i = 0; i < P_FOUR.length; i++) if (s.indexOf(P_FOUR[i]) >= 0) return 4;
  for (i = 0; i < P_OPEN3.length; i++) if (s.indexOf(P_OPEN3[i]) >= 0) return 3;
  for (i = 0; i < P_THREE.length; i++) if (s.indexOf(P_THREE[i]) >= 0) return 2;
  for (i = 0; i < P_TWO.length; i++) if (s.indexOf(P_TWO[i]) >= 0) return 1;
  return 0;
}

/* 某一落点对某一方的威胁值（越大越强；含双四/四三/双活三加成） */
function pointScore(bd, color, cell) {
  var r = Math.floor(cell / 15), c = cell % 15;
  var lv = [0, 0, 0, 0];
  for (var d = 0; d < 4; d++) {
    var dr = EDIR[d][0], dc = EDIR[d][1];
    var s = '';
    for (var k = -5; k <= 5; k++) {
      var rr = r + dr * k, cc = c + dc * k;
      if (rr < 0 || rr > 14 || cc < 0 || cc > 14) s += '2';
      else {
        var v = bd[rr * 15 + cc];
        s += v === 0 ? '0' : (v === color ? '1' : '2');
      }
    }
    lv[d] = lineClass(s);
  }
  lv.sort(function (a, b) { return b - a; });
  var sum = lv[0] + lv[1] * 0.6 + lv[2] * 0.3 + lv[3] * 0.15;
  if (lv[0] >= 4 && lv[1] >= 4) sum += 3;          /* 双四 */
  else if (lv[0] >= 4 && lv[1] >= 3) sum += 2;     /* 四三 */
  else if (lv[0] >= 3 && lv[1] >= 3) sum += 1.5;   /* 双活三 */
  return sum;
}

/* 候选落点集合：已有棋子周围 2 格内的空点 */
function nearCells(bd) {
  var list = [], mark = new Uint8Array(225);
  for (var i = 0; i < 225; i++) {
    if (bd[i] === 0) continue;
    var r = Math.floor(i / 15), c = i % 15;
    for (var dr = -2; dr <= 2; dr++) {
      for (var dc = -2; dc <= 2; dc++) {
        var rr = r + dr, cc = c + dc;
        if (rr < 0 || rr > 14 || cc < 0 || cc > 14) continue;
        var cell = rr * 15 + cc;
        if (bd[cell] !== 0 || mark[cell]) continue;
        mark[cell] = 1;
        list.push(cell);
      }
    }
  }
  return list;
}

/* 计算某一候选点的引擎胜率（下一手方视角）
 * 我方落子后的威胁等级 vs 对手紧接着的最佳威胁（两层预判） */
function evalCell(bd, cell, me, oppCells) {
  var opp = 3 - me;
  if (bd[cell] !== 0) return 0.5;
  bd[cell] = me;

  var myA = pointScore(bd, me, cell);
  if (myA >= 6) { bd[cell] = 0; return 1; }

  var oppA = 0;
  for (var i = 0; i < oppCells.length; i++) {
    var c2 = oppCells[i];
    if (c2 === cell || bd[c2] !== 0) continue;
    bd[c2] = opp;
    var t = pointScore(bd, opp, c2);
    bd[c2] = 0;
    if (t > oppA) {
      oppA = t;
      if (oppA >= 6) break;   /* 对手可直接成五，无需再算 */
    }
  }
  bd[cell] = 0;

  if (oppA >= 6) return 0.03;
  var diff = myA - oppA * 1.08;
  var p = 0.5 + 0.44 * Math.tanh(diff / 3.2);
  if (p > 0.97) p = 0.97;
  if (p < 0.03) p = 0.03;
  return p;
}
function engineCompute() {
  if (!lastCands.length) return null;
  var bd = buildBoard();
  var me = state.moves.length % 2 === 0 ? 1 : 2;
  var oppCells = nearCells(bd);
  var out = [];
  for (var i = 0; i < lastCands.length; i++) {
    out.push(evalCell(bd, lastCands[i][0], me, oppCells));
  }
  return out;
}

function buildBoard() {
  var bd = new Uint8Array(225);
  for (var i = 0; i < state.moves.length; i++) bd[state.moves[i]] = (i % 2 === 0) ? 1 : 2;
  return bd;
}

/* ---------- Rapfi WASM 引擎：按需加载 + 异步请求 ----------
 * 首次点按钮时才开始下载 wasm/权重（约 20MB），引擎返回自己的 Top-10 好点。 */
var rapfiWorker = null;
var rapfiState = 'idle';   // idle / loading / ready / failed
var rapfiSeq = 0;          // 请求序号，用于丢弃过期结果
var _lastProgressSyncT = 0; /* progress 主线程去抖：至少间隔 400ms */

function rapfiStart() {
  if (rapfiState === 'loading' || rapfiState === 'ready' || rapfiState === 'failed') return;
  rapfiState = 'loading';
  try {
    rapfiWorker = new Worker('engine/rapfi-worker.js');
  } catch (e) {
    rapfiState = 'failed';
    engineBusy = false;
    engineTop = engineTop10Fallback();   /* 用内置估算也返回独立的 Top-10 */
    requestDraw();
    return;
  }
  rapfiWorker.onmessage = function (ev) {
    var d = ev.data || {};
    if (d.type === 'status') {
      console.log('[RAPFI] status:', d.data);
      if (d.data === 'ready') {
        rapfiState = 'ready';
        if (engineOn) rapfiRequest();
      } else {
        rapfiState = 'failed';
        engineBusy = false;
        var fb = engineTop10Fallback();
        engineTop = fb;
        syncEngineAnim(fb);
        startAnim();
      }
    } else if (d.type === 'progress') {
      console.log('[RAPFI] progress id=' + d.id + ' seq=' + rapfiSeq + ' len=' + (d.data||[]).length);
      if (d.id !== rapfiSeq || !engineOn) return;
      if (d.data && d.data.length) {
        engineTop = d.data;
        var now = Date.now();
        if (now - _lastProgressSyncT >= 400) {
          _lastProgressSyncT = now;
          syncEngineAnim(d.data);
          startAnim();
        }
      }
    } else if (d.type === 'result') {
      console.log('[RAPFI] RESULT id=' + d.id + ' seq=' + rapfiSeq + ' len=' + (d.data||[]).length);
      if (d.id !== rapfiSeq || !engineOn) return;
      engineBusy = false;
      if (d.data && d.data.length) {
        engineTop = d.data;
        _lastProgressSyncT = Date.now();
        syncEngineAnim(d.data);
        startAnim();
      }
    }
  };
  rapfiWorker.onerror = function () {
    rapfiState = 'failed';
    engineBusy = false;
    var fb2 = engineTop10Fallback();
    engineTop = fb2;
    syncEngineAnim(fb2);
    startAnim();
  };
}

/* ------ 引擎圆圈动画系统 ------
 * engineAnim 是一个 cell 级别的动画状态数组，包含当前值 + 目标值
 * syncEngineAnim(target) —— 把引擎新结果同步为目标值（不直接动当前值）
 * animTick() —— rAF 循环，每帧 lerp 当前值向目标值逼近，同时 draw()
 * 效果：圆圈数字、排名颜色、透明度都平滑过渡，不瞬间跳变 */

function syncEngineAnim(target) {
  if (!target) { engineAnim = []; return; }
  /* cell → new rank 映射 */
  var newMap = {};
  for (var i = 0; i < target.length; i++) newMap[target[i][0]] = i;
  var newCells = {}; for (var k in newMap) newCells[k] = true;

  /* 统计新旧差异，决定是否跳过动画 */
  var oldCellSet = {};
  for (var j = 0; j < engineAnim.length; j++) oldCellSet[engineAnim[j].cell] = true;
  var overlap = 0, oldCount = engineAnim.length;
  for (var c in newCells) if (oldCellSet[c]) overlap++;
  /* 低胜率判定：target 里所有 wr < 0.05 视为结果不稳定 */
  var lowWr = true;
  for (var i2 = 0; i2 < target.length; i2++) if (target[i2][1] >= 0.05) { lowWr = false; break; }
  var tooMuchChange = oldCount > 0 && (overlap / oldCount < 0.6);

  if (tooMuchChange || lowWr) {
    /* 差异太大或胜率极低 → 直接替换，不做淡出淡入（防闪屏） */
    engineAnim = [];
    for (var i3 = 0; i3 < target.length; i3++) {
      engineAnim.push({
        cell: target[i3][0], wr: target[i3][1], targetWr: target[i3][1],
        alpha: 1, targetAlpha: 1,
        rank: i3, targetRank: i3
      });
    }
    return;
  }

  /* 更新已有条目 + 标记消失 */
  var oldMap = {};
  for (var j2 = 0; j2 < engineAnim.length; j2++) {
    var a = engineAnim[j2]; oldMap[a.cell] = j2;
    if (newCells[a.cell]) {
      var newRank = newMap[a.cell];
      a.targetWr = target[newRank][1];
      a.targetRank = newRank;
      a.targetAlpha = 1;
    } else {
      a.targetAlpha = 0;  /* 淡出 */
    }
  }
  /* 新 cell → 淡入 */
  for (var c2 in newCells) if (!oldMap[c2]) {
    var newR = newMap[c2];
    engineAnim.push({
      cell: +c2, wr: target[newR][1], targetWr: target[newR][1],
      alpha: 0, targetAlpha: 1,
      rank: newR, targetRank: newR
    });
  }
}

/* candColor 的 lerp：取 rank0/1/2 的 RGB，按 rank 权重混合 */
function candColorLerp(fromRank, toRank, t) {
  var palette = ['#2f7cf6', '#34a853', '#f1b82c', '#9aa0a6'];
  var fr = palette[Math.max(0, Math.min(3, fromRank|0))] || palette[0];
  var tr = palette[Math.max(0, Math.min(3, toRank|0))] || palette[0];
  if (!fr || !tr) return palette[0];
  if (fr === tr) return fr;
  var fh = fr.slice(1), th = tr.slice(1);
  if (!fh || !th || fh.length !== 6) return palette[0];
  var r1 = parseInt(fh.substr(0, 2),16), g1 = parseInt(fh.substr(2,2),16), b1 = parseInt(fh.substr(4,2),16);
  var r2 = parseInt(th.substr(0, 2),16), g2 = parseInt(th.substr(2,2),16), b2 = parseInt(th.substr(4,2),16);
  if (!isFinite(r1) || !isFinite(r2)) return palette[0];
  var r = Math.round(r1 + (r2-r1)*t), g = Math.round(g1 + (g2-g1)*t), b = Math.round(b1 + (b2-b1)*t);
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return '#' + [r,g,b].map(function(x){var h=(x|0).toString(16);return h.length<2?'0'+h:h}).join('');
}

/* rAF 动画循环 */
function animTick() {
  if (!engineOn) { animRafId = 0; engineAnim = []; draw(); return; }
  var LERP = 0.22;  /* 每帧 22% 逼近目标 ≈ 0.6s 完全过渡 */
  var maxAlpha = 0;
  for (var i = 0; i < engineAnim.length; i++) {
    var a = engineAnim[i];
    a.wr += (a.targetWr - a.wr) * LERP;
    a.rank += (a.targetRank - a.rank) * LERP;
    a.alpha += (a.targetAlpha - a.alpha) * LERP;
    if (a.alpha > 0.02 && a.alpha < a.targetAlpha - 0.01) maxAlpha = 1;
    if (a.alpha > maxAlpha) maxAlpha = a.alpha;
  }
  /* 清理完全淡出的 */
  engineAnim = engineAnim.filter(function(a){ return a.alpha > 0.05 || a.targetAlpha > 0.05; });
  draw();
  animRafId = requestAnimationFrame(animTick);
}

/* 启动/停止动画循环 */
function startAnim() { if (!animRafId) animRafId = requestAnimationFrame(animTick); }
function stopAnim() { if (animRafId) { cancelAnimationFrame(animRafId); animRafId = 0; } }

function engineTop10Fallback() {
  /* 用内置轻量估算器跑一遍，返回独立的 Top-10（不依赖 lastCands） */
  var bd = buildBoard();
  var me = state.moves.length % 2 === 0 ? 1 : 2;
  var opp = me === 1 ? 2 : 1;
  var oppCells = nearCells(bd);
  /* 收集所有空点作为候选 */
  var cands = [];
  for (var c = 0; c < 225; c++) if (bd[c] === 0) cands.push(c);
  var scored = [];
  for (var i = 0; i < cands.length; i++) scored.push([cands[i], evalCell(bd, cands[i], me, oppCells)]);
  scored.sort(function (a, b) { return b[1] - a[1]; });
  return scored.slice(0, 10);
}

function rapfiRequest() {
  rapfiStart();
  if (rapfiState !== 'ready') {
    /* 引擎尚未就绪，先显示兜底估算，避免开局空白 */
    if (!engineTop) engineTop = engineTop10Fallback();
    return;
  }
  var moves = [];
  for (var i = 0; i < state.moves.length; i++) moves.push([state.moves[i], (i % 2 === 0) ? 1 : 2]);
  rapfiSeq++;
  engineBusy = true;
  rapfiWorker.postMessage({ type: 'analyze', id: rapfiSeq, moves: moves, topN: 10, timeMs: 2500 });
  requestDraw();   // 先把"引擎计算中…"标出来
}

/* rAF 节流：不管多少地方请求 draw，一帧只真正画一次 —— 防闪屏 */
var _drawPending = false;
function requestDraw() {
  if (_drawPending) return;
  _drawPending = true;
  requestAnimationFrame(function () {
    _drawPending = false;
    draw();
  });
}

/* 棋盘上方的小立体棋子（用于标注对局双方） */
function drawMiniStone(x, y, r, isBlack) {
  var grad = ctx.createRadialGradient(x - r / 3, y - r / 3, r / 5, x, y, r);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (isBlack) {
    grad.addColorStop(0, '#5a5a5a'); grad.addColorStop(0.65, '#2a2a2a'); grad.addColorStop(1, '#111');
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  } else {
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.6, '#e0e0e0'); grad.addColorStop(1, '#b8b8b8');
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = '#777'; ctx.lineWidth = 1; ctx.stroke();
  }
}

/* 棋盘上方：显示这一局的黑白双方（黑方在前、白方在后）
 * 触发条件：当前分支只剩这一局（提前显示），或棋谱已全部摆完
 * 只在 Top100 与选手个人页显示；全部对局页不显示 */
function drawEndGameTitle() {
  if (state.dataset === 'all') return;
  var list = endedGames.length ? endedGames : (branchGames.length === 1 ? branchGames : null);
  if (!list || !list.length) return;
  /* 优先选用两边选手名都齐全的对局，避免显示 #pid */
  var g = list[0], i;
  for (i = 0; i < list.length; i++) {
    var gi = list[i];
    if (RAW.pname[String(BLACK[gi])] && RAW.pname[String(WHITE[gi])]) { g = gi; break; }
  }
  var bName = playerLabel(BLACK[g]);
  var wName = playerLabel(WHITE[g]);
  var more = list.length > 1 ? t('endMore1') + list.length + t('endMore2') : '';
  var sep = '  vs  ';
  var maxW = cx(N - 1) - cx(0);
  var fontPx = 15, fontStr = '', stoneR = 0, wB = 0, wW = 0, wSep = 0, wMore = 0, total = 0;
  /* 名字太长时自动缩小字号，保证不超出棋盘宽度 */
  for (; fontPx >= 10; fontPx--) {
    fontStr = 'bold ' + fontPx + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.font = fontStr;
    stoneR = fontPx * 0.42;
    wB = ctx.measureText(bName).width;
    wW = ctx.measureText(wName).width;
    wSep = ctx.measureText(sep).width;
    wMore = more ? ctx.measureText(more).width : 0;
    total = 4 * stoneR + 10 + wB + wSep + wW + wMore;
    if (total <= maxW) break;
  }
  var y = PAD - 32;
  var x = (cx(0) + cx(N - 1)) / 2 - total / 2;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  /* 黑方：棋子 + 名字 */
  drawMiniStone(x + stoneR, y, stoneR, true);
  x += stoneR * 2 + 5;
  ctx.font = fontStr;
  ctx.fillStyle = '#3f3320';
  ctx.fillText(bName, x, y);
  x += wB;
  ctx.fillStyle = '#8a7a5c';
  ctx.fillText(sep, x, y);
  x += wSep;
  /* 白方：棋子 + 名字 */
  drawMiniStone(x + stoneR, y, stoneR, false);
  x += stoneR * 2 + 5;
  ctx.fillStyle = '#3f3320';
  ctx.fillText(wName, x, y);
  x += wW;
  if (more) {
    ctx.font = 'bold ' + Math.max(10, Math.round(fontPx * 0.8)) + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = '#a08c62';
    ctx.fillText(more, x, y);
  }
}

function draw() {
  ctx.save();  /* 保护 canvas 状态：任何修改都不会泄漏 */
  var size = canvas.width;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, size, size);
  var s = size / LOGIC;
  ctx.setTransform(s, 0, 0, s, 0, 0);

  ctx.fillStyle = '#ffd88b';
  ctx.fillRect(0, 0, LOGIC, LOGIC);

  ctx.strokeStyle = '#695020';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var i = 0; i < N; i++) {
    var p = PAD + i * CELL;
    ctx.moveTo(p, PAD);
    ctx.lineTo(p, PAD + (N - 1) * CELL);
    ctx.moveTo(PAD, p);
    ctx.lineTo(PAD + (N - 1) * CELL, p);
  }
  ctx.stroke();

  ctx.fillStyle = '#695020';
  for (var k = 0; k < STARS.length; k++) {
    ctx.beginPath();
    ctx.arc(cx(STARS[k][1]), cy(STARS[k][0]), 4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(105, 80, 32, 0.62)';
  ctx.font = '15px "Microsoft YaHei", "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var c = 0; c < N; c++) {
    ctx.fillText(String.fromCharCode(65 + c), cx(c), PAD + (N - 1) * CELL + 30);
  }
  for (var r = 0; r < N; r++) {
    ctx.fillText(String(N - r), PAD - 30, cy(r));
  }

  for (var m = 0; m < state.moves.length; m++) {
    var cell = state.moves[m];
    var row = Math.floor(cell / 15), col = cell % 15;
    ctx.beginPath();
    ctx.arc(cx(col), cy(row), STONE_R, 0, Math.PI * 2);
    if (m % 2 === 0) {
      ctx.fillStyle = '#222222';
      ctx.fill();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#96805c';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.fillStyle = (m % 2 === 0) ? '#ffffff' : '#5a3d16';
    ctx.font = 'bold 15px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillText(String(m + 1), cx(col), cy(row));
  }

  /* 候选圆圈：引擎模式 → engineAnim（lerp 动画状态，平滑过渡）；
   *          普通模式 → 数据库统计出来的候选点 + 得分率
   * 保护：engineAnim 被意外清空但 engineTop 还有数据 → 临时重建 engineAnim 防空白 */
  if (engineOn && !engineAnim.length && engineTop && engineTop.length) {
    for (var __k = 0; __k < engineTop.length; __k++) {
      engineAnim.push({
        cell: engineTop[__k][0], wr: engineTop[__k][1], targetWr: engineTop[__k][1],
        alpha: 1, targetAlpha: 1, rank: __k, targetRank: __k
      });
    }
  }
  if (engineOn && engineAnim.length) {
    for (var k = 0; k < engineAnim.length; k++) {
      var a = engineAnim[k];
      if (a.alpha < 0.02) continue;
      var ek = a.cell, ew = a.wr;
      var er = Math.floor(ek / 15), ec = ek % 15;
      ctx.beginPath();
      ctx.arc(cx(ec), cy(er), CAND_R, 0, Math.PI * 2);
      /* rank lerp → 颜色平滑过渡 */
      ctx.fillStyle = candColorLerp(a.rank, a.targetRank, 1);
      ctx.globalAlpha = Math.max(0, Math.min(1, a.alpha)) * (state.hoverCell === ek ? 1 : 0.88);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (state.hoverCell === ek) {
        ctx.strokeStyle = '#5a3d16';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px "Microsoft YaHei", "PingFang SC", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(Math.round(ew * 100)), cx(ec), cy(er));
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  } else if (!engineOn) {
    for (var j = 0; j < lastCands.length; j++) {
      var cell2 = lastCands[j][0], g = lastCands[j][1], w = lastCands[j][2], dd = lastCands[j][3];
      var row2 = Math.floor(cell2 / 15), col2 = cell2 % 15;
      var sr = g > 0 ? (w + dd * 0.5) / g : 0;
      ctx.beginPath();
      ctx.arc(cx(col2), cy(row2), CAND_R, 0, Math.PI * 2);
      ctx.fillStyle = candColor(j);
      ctx.globalAlpha = state.hoverCell === cell2 ? 1 : 0.88;
      ctx.fill();
      ctx.globalAlpha = 1;
      if (state.hoverCell === cell2) {
        ctx.strokeStyle = '#5a3d16';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px "Microsoft YaHei", "PingFang SC", sans-serif';
      ctx.fillText(String(Math.round(sr * 100)), cx(col2), cy(row2));
    }
  }

  /* 对局全部摆完：棋盘上方显示这一局的黑白双方 */
  drawEndGameTitle();

  /* 选手个人页：棋盘正上方显示选手执黑/执白的总盘数（走到此局面的总数，立体棋子） */
  if (state.dataset === 'player' && currentPlayer && lastCands.length) {
    var sB = lastCands.bw0 || 0;
    var sW = lastCands.ww0 || 0;
    var items = [];
    if (sB > 0) items.push({ side: 'black', n: sB });
    if (sW > 0) items.push({ side: 'white', n: sW });
    if (items.length) {
      ctx.font = 'bold 15px "Microsoft YaHei", "PingFang SC", sans-serif';
      var gap = 26, dotR = 8, itemPad = 6;
      var itemWidths = [];
      for (var li = 0; li < items.length; li++) {
        var label = items[li].side === 'black' ? t('black') : t('white');
        var txt = label + ' ' + items[li].n.toLocaleString();
        itemWidths.push(ctx.measureText(txt).width + dotR * 2 + itemPad * 2 + 6);
      }
      var totalW = 0;
      for (var wi = 0; wi < itemWidths.length; wi++) totalW += itemWidths[wi];
      totalW += gap * (itemWidths.length - 1);
      var cx0 = cx(0), cx1 = cx(N - 1);
      var startX = (cx0 + cx1 - totalW) / 2;
      var baseY = PAD - 12;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      var x = startX;
      for (var li2 = 0; li2 < items.length; li2++) {
        var side = items[li2].side;
        var label2 = side === 'black' ? t('black') : t('white');
        var txt2 = label2 + ' ' + items[li2].n.toLocaleString();
        var dx = x + dotR + itemPad;
        /* 立体棋子 */
        var grad = ctx.createRadialGradient(dx - dotR / 3, baseY - dotR / 3, dotR / 5, dx, baseY, dotR);
        ctx.beginPath(); ctx.arc(dx, baseY, dotR, 0, Math.PI * 2);
        if (side === 'black') {
          grad.addColorStop(0, '#5a5a5a'); grad.addColorStop(0.65, '#2a2a2a'); grad.addColorStop(1, '#111');
          ctx.fillStyle = grad; ctx.fill();
          ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
        } else {
          grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.6, '#e0e0e0'); grad.addColorStop(1, '#b8b8b8');
          ctx.fillStyle = grad; ctx.fill();
          ctx.strokeStyle = '#777'; ctx.lineWidth = 1; ctx.stroke();
        }
        ctx.fillStyle = '#4a3d20';
        ctx.fillText(txt2, x + dotR * 2 + itemPad * 2 + 2, baseY);
        x += itemWidths[li2] + gap;
      }
    }
  }

  /* 引擎模式：棋盘正上方左侧标注当前显示口径 */
  if (engineOn) {
    ctx.font = 'bold 14px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    var markY = PAD - 12;
    ctx.fillStyle = engineBusy ? '#8a7a5c' : '#2f7cf6';
    ctx.beginPath();
    ctx.arc(cx(0) + 5, markY, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4a3d20';
    ctx.fillText(engineBusy ? t('engineBusy') : t('engineMark'), cx(0) + 15, markY);
  }
  ctx.restore();  /* 恢复 canvas 状态 */
}

    engineTop10: 'Rapfi Top-10 추천 수', engineWin: '엔진 승률', engineCalc: '계산 중…',
    endMore1: ' (총 ', endMore2: ' 국)',
    back: '← 선수 목록으로',
    rifRating: 'RIF 레이팅',
    total: '통산', winRate: '승률', scoreRate: '득점률', asBlack: '흑', asWhite: '백', gamesUnit: ' 국', share: '비중', withMoves: '기보 포함',
    opening: '초반 · 흑 선수', moveN1: '제 ', moveN2: ' 수 · ', black: '흑', white: '백', moveN3: ' 차례',
    rootLine1: '미착수 · 현재 필터 흑승 ', rootLine2: ' / 백승 ', rootLine3: ' / 무승부 ',
    noGames: '현재 조건에 해당하는 대국이 없습니다.',
    reached: '이 국면(대칭 포함)에 도달한 대국: ', reachedEnd: ' 국',
    noBranch: '이 분기에 후속 대국이 없습니다. 조건을 바꾸거나 우클릭으로 돌아가세요.',
    statGames: ' 국 · ', statNone: '대국 없음',
    oppIn1: '레이팅 ', oppIn2: ' 상대:', oppIn3: ' 이상', oppOut: '', oppOut2: '구간 밖', oppOut3: ' 상대:',
    oppNote: '레이팅은 ljrenju 2026-10기(현행값); 기간은 위 필터와 연동',
    ratingUnit: '', opp: '상대', pAs: '선수는 ', pSide: '측으로 착수'
  }
};
var lang = 'zh';
function t(k) { return I18N[lang][k]; }

function applyLang() {
  document.querySelector('.panel h1').textContent = t('h1');
  document.querySelector('.panel .sub').innerHTML = t('sub');
  tabAll.textContent = t('tabAll');
  tabTop.textContent = t('tabTop');
  tabPlayer.textContent = t('tabPlayer');
  el('ltCur').textContent = t('listCur'); el('ltWomen').textContent = t('listWomen'); el('ltQT').textContent = t('listQT');
  el('ltAll').textContent = t('listAll'); el('ltWomenAll').textContent = t('listWomenAll');
  el('tFoot').textContent = t('foot');
  document.getElementById('lblRule').textContent = t('rule');
  elRuleSel.options[0].text = t('allRules');
  document.getElementById('lblTime').textContent = t('time');
  elYearFrom.options[0].text = t('anyYear');
  elYearTo.options[0].text = t('toNow');
  document.getElementById('lblScope').textContent = t('dsScope');
  document.getElementById('lblOpp').textContent = t('oppRating');
  elOppHi.placeholder = t('noLimit');
  document.getElementById('legendBox').innerHTML =
    '<span><i class="dot" style="background:var(--blue)"></i>' + t('legend1') + '</span>' +
    '<span><i class="dot" style="background:var(--green)"></i>' + t('legend2') + '</span>' +
    '<span><i class="dot" style="background:var(--gray)"></i>' + t('legend3') + '</span>';
  document.getElementById('lblBranch').textContent = t('curBranch');
  document.getElementById('btnReset').textContent = t('reset');
  document.getElementById('btnBack').title = t('undo');
  document.getElementById('btnFwd').title = t('redo');
  document.getElementById('btnEngine').textContent = engineOn ? t('engineOff') : t('engineOn');
  document.getElementById('lblCand').textContent = t('candLabel');
  document.querySelectorAll('#langs button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.lang === lang);
  });

}

document.getElementById('langs').addEventListener('click', function (ev) {
  var b = ev.target.closest('button');
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  applyLang();
});

function setTab(name) {
  state.dataset = name;
  tabAll.classList.toggle('active', name === 'all');
  tabTop.classList.toggle('active', name === 'top100');
  tabPlayer.classList.toggle('active', name === 'player');
}

/* 选手显示名：中文界面显示中文名（可附英文），其他语言只显示英文名 */
function playerName(p, withEn) {
  if (lang === 'zh') return (p.cn || p.en) + (withEn && p.cn ? '<i>' + p.en + '</i>' : '');
  return p.en;
}

var listMode = 'cur';
var CUR_YEAR = new Date().getFullYear();
function ageStr(p) { return p.by ? ' · ' + (CUR_YEAR - p.by) + t('ageUnit') : ''; }

function renderPlayerList() {
  var src, isW = false, limit = 100;
  if (listMode === 'qt') { src = RAW.listQT || []; limit = 20; }
  else if (listMode === 'cur' || listMode === 'women') { src = RAW.listActive || RAW.top100; isW = listMode === 'women'; }
  else { src = RAW.listHist || RAW.top100All || []; isW = listMode === 'wall'; }
  var html = '', shown = 0;
  for (var i = 0; i < src.length && shown < limit; i++) {
    var p = src[i];
    if (isW && !p.f) continue;
    shown++;
    var rkCls = shown === 1 ? ' r1' : shown === 2 ? ' r2' : shown === 3 ? ' r3' : '';
    html += '<li data-disp="' + p.disp + '"><span class="rk' + rkCls + '">' + shown + '</span>' +
      '<span class="nm' + (p.f ? ' f' : '') + '">' + playerName(p, true) + '<span class="age">' + ageStr(p) + '</span></span>' +
      '<span class="rt">' + p.rating + '</span></li>';
  }
  elPlayerList.innerHTML = html;
}

function selectPlayer(disp) {
  var p = null, lists = [RAW.top100, RAW.top100All || [], RAW.listActive || [], RAW.listHist || [], RAW.listQT || []];
  for (var li = 0; li < lists.length && !p; li++) {
    for (var i = 0; i < lists[li].length; i++) {
      if (lists[li][i].disp === disp) { p = lists[li][i]; break; }
    }
  }
  if (!p) return;
  currentPlayer = p;
  state.playerPid = RAW.pidByDisp[disp] || 0;
  rebuildKeepMoves();
}

var elEndGames = document.getElementById('endGames');
function playerLabel(pid) {
  var nm = RAW.pname ? RAW.pname[String(pid)] : null;
  if (!nm) return '#' + pid;
  var parts = nm.split('|');
  return lang === 'zh' && parts[1] ? parts[0] + ' ' + parts[1] : (parts[1] || parts[0]);
}
function renderEndGames() {
  var n = state.moves.length;
  if (n === 0 || !endedGames.length) { elEndGames.innerHTML = ''; return; }
  var rows = [];
  for (var i = 0; i < endedGames.length; i++) {
    var g = endedGames[i];
    var r = RES[g] & 3;
    rows.push('<li><span class="yr">' + (YEAR[g] + 1900) + '</span> ' +
      playerLabel(BLACK[g]) + ' vs ' + playerLabel(WHITE[g]) +
      ' · <b>' + (r === 0 ? t('resB') : r === 1 ? t('resW') : t('resD')) + '</b></li>');
  }
  elEndGames.innerHTML = rows.length
    ? '<div class="egt">' + t('endHere') + '（' + rows.length + '）</div><ul>' + rows.join('') + '</ul>'
    : '';
}

function refresh() {
  var picking = state.dataset === 'player' && !state.playerPid;
  elPlayerListBox.style.display = picking ? '' : 'none';
  elTreeBox.style.display = picking ? 'none' : '';

  if (picking) {
    elDsInfo.textContent = t('picking');
    lastCands = [];
    endedGames = [];
    branchGames = [];
    engineTop = null;
    syncEngineAnim(null);
    stopAnim();
    document.getElementById('endGames').innerHTML = '';
    requestDraw();
    return;
  }

  lastCands = candidates();
  /* 统计当前分支：去重后的对局列表 branchGames，以及已走完全部棋谱的对局 endedGames */
  endedGames = [];
  branchGames = [];
  var seenEnd = {};
  for (var ei = 0; ei < matchList.length; ei++) {
    var eg = matchList[ei] >> 3;
    if (seenEnd[eg]) continue;
    seenEnd[eg] = 1;
    branchGames.push(eg);
    if (LENS[eg] === state.moves.length) endedGames.push(eg);
  }
  engineTop = null;           /* 每次刷新先清，等引擎异步回填 */
  syncEngineAnim(null);       /* 同步清动画，避免旧动画覆盖新状态 */
  engineBusy = false;
  if (engineOn) {
    var fb = engineTop10Fallback();   /* 立刻给兜底，避免开局空白 */
    engineTop = fb;
    syncEngineAnim(fb);               /* 兜底也走动画 */
    startAnim();
    rapfiRequest();                      /* 异步用 Rapfi 覆盖 */
  }
  requestDraw();

  if (state.dataset === 'all') {
    elDsInfo.textContent = t('dsAll') + RAW.counts.all.toLocaleString() + t('dsGames');
  } else if (state.dataset === 'top100') {
    elDsInfo.textContent = t('dsTop') + RAW.counts.top100.toLocaleString() + t('dsGames');
  } else {
    elDsInfo.textContent = currentPlayer ? playerName(currentPlayer, false) + t('dsPlayer') : '';
  }

  /* 选手资料卡 + 对手分级战绩 */
  if (state.dataset === 'player' && currentPlayer) {
    var ps = playerStats(state.playerPid);
    var wins = ps.bw + ps.ww, draws = ps.bd + ps.wd;
    var bg = ps.bw + ps.bd + ps.bl, wg = ps.ww + ps.wd + ps.wl;
    elPcard.innerHTML =
      '<span class="back" id="pback">' + t('back') + '</span>' +
      '<span class="pname' + (currentPlayer.f ? ' f' : '') + '">#' + currentPlayer.rank + ' ' + playerName(currentPlayer, false) + '</span>' +
      '<span class="pen">' + (lang === 'zh' ? currentPlayer.en : '') + '</span><br>' +
      (currentPlayer.country ? currentPlayer.country + (currentPlayer.city ? ' · ' + currentPlayer.city : '') + '<br>' : '') +
      t('rifRating') + ' <b>' + currentPlayer.rating + '</b>' + (currentPlayer.by ? ' ·' + ageStr(currentPlayer) : '') + '<br>' +
      t('total') + ' <b>' + ps.g + '</b>' + t('gamesUnit') + '（' + t('withMoves') + ' ' + ps.gm + '）：' + t('winRate') + ' <b>' + (ps.g ? fmtPct(wins / ps.g) : '-') +
      '</b> · ' + t('scoreRate') + ' <b>' + (ps.g ? fmtPct(scoreRate(wins, draws, ps.g)) : '-') + '</b><br>' +
      t('asBlack') + ' ' + bg + t('gamesUnit') + '（' + t('share') + ' ' + (ps.g ? fmtPct(bg / ps.g) : '-') + '）：' + t('winRate') + ' ' +
      (bg ? fmtPct(ps.bw / bg) : '-') + ' · ' + t('scoreRate') + ' ' + (bg ? fmtPct(scoreRate(ps.bw, ps.bd, bg)) : '-') + '<br>' +
      t('asWhite') + ' ' + wg + t('gamesUnit') + '（' + t('share') + ' ' + (ps.g ? fmtPct(wg / ps.g) : '-') + '）：' + t('winRate') + ' ' +
      (wg ? fmtPct(ps.ww / wg) : '-') + ' · ' + t('scoreRate') + ' ' + (wg ? fmtPct(scoreRate(ps.ww, ps.wd, wg)) : '-');
    elPcard.hidden = false;
    elOppBox.hidden = false;
    renderOppStats();
    document.getElementById('pback').addEventListener('click', function () {
      state.playerPid = 0;
      currentPlayer = null;
      refresh();
    });
  } else {
    elPcard.hidden = true;
    elOppBox.hidden = true;
  }

  var nextBlack = state.moves.length % 2 === 0;
  var nextTxt = nextBlack ? t('black') : t('white');
  elCurInfo.textContent = state.moves.length === 0
    ? t('opening')
    : t('moveN1') + (state.moves.length + 1) + t('moveN2') + nextTxt + t('moveN3');

  if (state.moves.length === 0) {
    var rs = rootStats();
    if (rs[0] > 0) {
      var bw = rs[1] / rs[0], dr = rs[2] / rs[0], ww2 = 1 - bw - dr;
      elPath.innerHTML = t('rootLine1') + '<b>' + fmtPct(bw) + '</b>' + t('rootLine2') +
        '<b>' + fmtPct(ww2) + '</b>' + t('rootLine3') + '<b>' + fmtPct(dr) + '</b>';
    } else {
      elPath.textContent = t('noGames');
    }
  } else {
    var parts = [];
    for (var i = 0; i < state.moves.length; i++) {
      parts.push('<b>' + (i + 1) + '</b>.' + coordName(state.moves[i]));
    }
    elPath.innerHTML = parts.join(' → ') +
      '<br>' + t('reached') + '<b>' + lastCands.reached.toLocaleString() + '</b>' + t('reachedEnd');
  }

  /* 候选列表：引擎模式 → 引擎 Top-10；普通模式 → 数据库候选点 */
  if (engineOn && engineTop && engineTop.length) {
    elCandCount.textContent = t('engineTop10');
    var html = '';
    for (var k = 0; k < engineTop.length; k++) {
      var ek2 = engineTop[k][0], ew2 = engineTop[k][1];
      var ecls = k === 0 ? 'b' : (k <= 9 ? 'g' : 'y');
      html += '<li data-cell="' + ek2 + '">' +
        '<span class="rank ' + ecls + '">' + (k + 1) + '</span>' +
        '<span class="coord">' + coordName(ek2) + '</span>' +
        '<span class="bar">' + t('engineWin') + ' ' + fmtPct(ew2) +
          (engineBusy ? ' · ' + t('engineCalc') : '') + '</span></li>';
    }
    elCandList.innerHTML = html;
  } else if (!engineOn && lastCands.length) {
    elCandCount.textContent = lastCands.length + t('candUnit');
    renderEndGames();
    var isPlayerScope = state.dataset === 'player' && currentPlayer;
    var html = '';
    for (var j = 0; j < lastCands.length; j++) {
      var cell = lastCands[j][0], g = lastCands[j][1], w = lastCands[j][2], d = lastCands[j][3];
      var cls = j === 0 ? 'b' : (j <= 9 ? 'g' : 'y');
      var content = g.toLocaleString() + t('gamesUnit') + ' · ' + t('scoreRate') + ' ' + fmtPct((w + d * 0.5) / g) +
        ' · ' + t('winRate') + ' ' + fmtPct(w / g);
      var pieceTag = '';
      if (isPlayerScope) {
        var bwH = lastCands[j][4] || 0, wwH = lastCands[j][5] || 0;
        /* 方括号：该选手在本点执黑/执白各落多少次（只显示 >0 的） */
        var tagParts = [];
        if (bwH > 0) tagParts.push(t('black') + ' ' + bwH);
        if (wwH > 0) tagParts.push(t('white') + ' ' + wwH);
        if (tagParts.length) content += ' <b>[' + tagParts.join(' · ') + ']</b>';
        /* 小圆圈：黑/白/并排 */
        if (bwH > 0 && wwH > 0) pieceTag = '<span class="pieceTag mix"><span class="pieceTag k"></span><span class="pieceTag w"></span></span>';
        else if (bwH > 0) pieceTag = '<span class="pieceTag k"></span>';
        else if (wwH > 0) pieceTag = '<span class="pieceTag w"></span>';
      }
      html += '<li data-cell="' + cell + '">' +
        '<span class="rank ' + cls + '">' + (j + 1) + '</span>' +
        pieceTag +
        '<span class="coord">' + coordName(cell) + '</span>' +
        '<span class="bar">' + content + '</span></li>';
    }
    elCandList.innerHTML = html;
  } else {
    elCandCount.textContent = (engineOn && engineBusy ? '' : (lastCands.length + t('candUnit')));
    elCandList.innerHTML = '<li class="empty" style="cursor:default">' + t('noBranch') + '</li>';
  }
}

/* ============================================================
 *  交互
 * ============================================================ */
function eventToCell(ev) {
  var rect = canvas.getBoundingClientRect();
  var x = (ev.clientX - rect.left) / rect.width * LOGIC;
  var y = (ev.clientY - rect.top) / rect.width * LOGIC;
  var col = Math.round((x - PAD) / CELL);
  var row = Math.round((y - PAD) / CELL);
  if (row < 0 || row >= N || col < 0 || col >= N) return null;
  if (Math.abs(x - cx(col)) > CELL / 2 || Math.abs(y - cy(row)) > CELL / 2) return null;
  return row * 15 + col;
}
function isCandidate(cell) {
  for (var i = 0; i < lastCands.length; i++) if (lastCands[i][0] === cell) return lastCands[i];
  return null;
}
function playCell(cell) {
  redoStack.length = 0;
  descend(cell);
  playStoneSound();
  refresh();
}

canvas.addEventListener('pointerdown', function (ev) {
  if (ev.button !== 0) return;
  var cell = eventToCell(ev);
  if (cell === null) return;
  if (state.moves.indexOf(cell) !== -1) { undo(); return; }
  playCell(cell);
});
canvas.addEventListener('contextmenu', function (ev) {
  ev.preventDefault();
  undo();
});

canvas.addEventListener('pointermove', function (ev) {
  var cell = eventToCell(ev);
  state.hoverCell = cell;
  requestDraw();
  var rec = cell === null ? null : isCandidate(cell);
  if (rec) {
    var row = Math.floor(cell / 15), col = cell % 15;
    var rect = canvas.getBoundingClientRect();
    tip.style.left = (cx(col) / LOGIC * rect.width) + 'px';
    tip.style.top = (cy(row) / LOGIC * rect.width - 10) + 'px';
    tip.innerHTML = coordName(cell) + '：' + rec[1].toLocaleString() + t('gamesUnit') + '，' + t('scoreRate') + ' ' +
      fmtPct((rec[2] + rec[3] * 0.5) / rec[1]) + '，' + t('winRate') + ' ' + fmtPct(rec[2] / rec[1]);
    tip.hidden = false;
  } else {
    tip.hidden = true;
  }
});
canvas.addEventListener('pointerleave', function () {
  state.hoverCell = null;
  tip.hidden = true;
  requestDraw();
});

document.getElementById('btnBack').addEventListener('click', undo);
document.getElementById('btnFwd').addEventListener('click', redo);
var btnEngine = document.getElementById('btnEngine');
btnEngine.addEventListener('click', function () {
  engineOn = !engineOn;
  btnEngine.classList.toggle('on', engineOn);
  btnEngine.textContent = engineOn ? t('engineOff') : t('engineOn');
  engineBusy = false;
  if (engineOn) {
    var fb = engineTop10Fallback();
    engineTop = fb;
    syncEngineAnim(fb);
    startAnim();
    rapfiRequest();
  } else {
    stopAnim();
    engineAnim = [];
    engineTop = null;
    rapfiSeq++;   /* 丢弃进行中的引擎请求 */
  }
  requestDraw();
});
document.getElementById('btnReset').addEventListener('click', function () {
  state.moves = [];
  redoStack.length = 0;
  buildRootMatchList();
  refresh();
});
elRuleSel.addEventListener('change', function () {
  state.rule = parseInt(elRuleSel.value, 10);
  state.moves = [];
  buildRootMatchList();
  refresh();
});
elYearFrom.addEventListener('change', onYearChange);
elYearTo.addEventListener('change', onYearChange);
elOppLo.addEventListener('change', renderOppStats);
elOppHi.addEventListener('change', renderOppStats);
function onYearChange() {
  var f = parseInt(elYearFrom.value, 10);   // 0 = 不限
  var t = parseInt(elYearTo.value, 10);     // 0 = 至今
  state.yearFrom = f;
  state.yearTo = t === 0 ? 9999 : t;
  if (state.yearTo < state.yearFrom && t !== 0 && f !== 0) {
    state.yearTo = state.yearFrom;
    elYearTo.value = elYearFrom.value;
  }
  state.moves = [];
  buildRootMatchList();
  refresh();
}
/* 重建当前数据集的匹配列表，但保留已落的棋子和顺序 */
function rebuildKeepMoves() {
  var saved = state.moves;
  state.moves = [];
  buildRootMatchList();
  for (var i = 0; i < saved.length; i++) descend(saved[i]);
  refresh();
}

tabAll.addEventListener('click', function () {
  setTab('all');
  rebuildKeepMoves();
});
tabTop.addEventListener('click', function () {
  setTab('top100');
  rebuildKeepMoves();
});
tabPlayer.addEventListener('click', function () {
  setTab('player');
  state.playerPid = 0;
  currentPlayer = null;
  refresh();
});
el('ltCur').addEventListener('click', function () { setListMode('cur', 'ltCur'); });
el('ltWomen').addEventListener('click', function () { setListMode('women', 'ltWomen'); });
el('ltQT').addEventListener('click', function () { setListMode('qt', 'ltQT'); });
el('ltAll').addEventListener('click', function () { setListMode('all', 'ltAll'); });
el('ltWomenAll').addEventListener('click', function () { setListMode('wall', 'ltWomenAll'); });
function setListMode(mode, btnId) {
  listMode = mode;
  ['ltCur', 'ltWomen', 'ltQT', 'ltAll', 'ltWomenAll'].forEach(function (x) { el(x).classList.toggle('on', x === btnId); });
  renderPlayerList();
}
elCandList.addEventListener('click', function (ev) {
  var li = ev.target.closest('li[data-cell]');
  if (!li) return;
  var cell = parseInt(li.getAttribute('data-cell'), 10);
  /* 引擎模式下，引擎自选点也是合法落子点 */
  if (engineOn && engineTop) {
    for (var i = 0; i < engineTop.length; i++) if (engineTop[i][0] === cell) { playCell(cell); return; }
  }
  if (!isCandidate(cell)) return;
  playCell(cell);
});
elPlayerList.addEventListener('click', function (ev) {
  var li = ev.target.closest('li[data-disp]');
  if (!li) return;
  selectPlayer(li.getAttribute('data-disp'));
});

window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', function () { setTimeout(resizeCanvas, 120); });

/* 填充规则下拉 */
(function () {
  var ids = Object.keys(RAW.rules).sort(function (a, b) { return a - b; });
  var html = '<option value="0">全部规则</option>';
  for (var i = 0; i < ids.length; i++) {
    html += '<option value="' + ids[i] + '">' + RAW.rules[ids[i]] + '</option>';
  }
  elRuleSel.innerHTML = html;
})();

/* 填充年份下拉（从/至，双向可选） */
(function () {
  var hf = '<option value="0">不限</option>';
  var ht = '<option value="0">至今</option>';
  for (var y = 2026; y >= 1986; y--) {
    hf += '<option value="' + y + '"' + (y === 2023 ? ' selected' : '') + '>' + y + '</option>';
    ht += '<option value="' + y + '">' + y + '</option>';
  }
  elYearFrom.innerHTML = hf;
  elYearTo.innerHTML = ht;
})();

renderPlayerList();
resizeCanvas();
buildRootMatchList();
refresh();
document.getElementById('loading').remove();
